<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulation de fichiers Excel</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Ton style personnalisé -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Manipulation de fichiers Excel</span>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="card">
                <div class="card-header">
                    <h2 class="h5 mb-0">Téléverser et traiter vos fichiers</h2>
                </div>
                <div class="card-body">

                    <!-- Formulaire -->
                    <form method="POST" enctype="multipart/form-data" class="mb-3">
                        <!-- Fichier source -->
                        <div class="mb-3">
                            <label for="file" class="form-label">Fichier Excel source :</label>
                            <input type="file"
                                   class="form-control"
                                   id="file"
                                   name="file"
                                   accept=".xlsx, .xls"
                                   required>
                        </div>

                        <!-- Feuille source -->
                        <div class="mb-3" id="sheet_selection" style="display: none;">
                            <label for="sheet_name" class="form-label">Choisissez une feuille source :</label>
                            <select class="form-select" id="sheet_name" name="sheet_name" required></select>
                        </div>

                        <hr>

                        <!-- Fichier cible -->
                        <div class="mb-3">
                            <label for="file_target" class="form-label">Fichier Excel cible :</label>
                            <input type="file"
                                   class="form-control"
                                   id="file_target"
                                   name="file_target"
                                   accept=".xlsx, .xls"
                                   required>
                        </div>

                        <!-- Feuille cible -->
                        <div class="mb-3" id="sheet_selection_target" style="display: none;">
                            <label for="sheet_name_target" class="form-label">Choisissez une feuille cible :</label>
                            <select class="form-select" id="sheet_name_target" name="sheet_name_target" required></select>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button type="submit"
                                    class="btn btn-primary"
                                    id="submit_button"
                                    disabled>
                                Lancer le traitement
                            </button>
                        </div>
                    </form>

                    <p class="small mb-0">
                        Les fichiers sont supprimés automatiquement du serveur après le téléchargement.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- jQuery et Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Ton script externe pour charger les feuilles -->
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
