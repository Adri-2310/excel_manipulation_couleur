<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résultat du traitement</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Ton style personnalisé -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Manipulation de fichiers Excel</span>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2 class="h5 mb-0">Résultat du traitement</h2>
                </div>
                <div class="card-body text-center">

                    <p class="mb-4">
                        {{ message }}
                    </p>

                    {% if chemin_fichier_modifie %}
                        <a href="{{ url_for('download', filename=chemin_fichier_modifie) }}"
                           class="btn btn-primary mb-3">
                            Télécharger le fichier généré
                        </a>
                    {% endif %}

                    <div>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                            Revenir au formulaire
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS (optionnel) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
