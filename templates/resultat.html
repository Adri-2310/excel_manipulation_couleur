<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résultat du traitement</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Manipulation de fichiers Excel</span>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2 class="h5 mb-0">Résultat du traitement</h2>
                </div>
                <div class="card-body text-center">

                    <p class="mb-4">
                        {{ message }}
                    </p>

                    {% if chemin_fichier_modifie %}
                        <a href="{{ url_for('download', filename=chemin_fichier_modifie) }}"
                           class="btn btn-primary mb-3"
                           id="download-btn">
                            Télécharger le fichier généré
                        </a>
                    {% endif %}

                    <p class="text-muted small">
                        Vous serez automatiquement renvoyé au formulaire dans quelques secondes.
                    </p>

                    <div>
                        <a href="{{ url_for('reset') }}" class="btn btn-outline-secondary">
                            Revenir immédiatement au formulaire
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const btn = document.getElementById('download-btn');

        if (btn) {
            // Quand l’utilisateur clique sur "Télécharger"
            btn.addEventListener('click', function () {
                // On attend 55 secondes avant de revenir à l’index
                setTimeout(function () {
                    window.location.href = "{{ url_for('index') }}";
                }, 55_000); // 55 000 ms = 55 s
            });
        } else {
            // Par sécurité : si pas de bouton (erreur), on peut quand même revenir après 55 s
            setTimeout(function () {
                window.location.href = "{{ url_for('index') }}";
            }, 55_000);
        }
    });
</script>

</body>
</html>
